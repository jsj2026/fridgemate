<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3a4252"/></marker></defs><rect width="900" height="260" fill="#fff"/><text x="20.0" y="24.0" font-size="16" font-weight="bold" fill="#1f2a44" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">현재 운용상황 (AS-IS)</text><rect x="20" y="50" width="150" height="72" rx="10" fill="#f4f5f7" stroke="#8a93a3" stroke-width="1.4"/><text x="95.0" y="72.0" font-size="13" font-weight="bold" fill="#3f4756" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">장보기</text><text x="95.0" y="98.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">주 1~2회 몰아서 구매</text><line x1="170" y1="86" x2="196" y2="86" stroke="#3a4252" stroke-width="1.5" marker-end="url(#ar)"/><rect x="196" y="50" width="150" height="72" rx="10" fill="#eef3fd" stroke="#3d63b8" stroke-width="1.4"/><text x="271.0" y="72.0" font-size="13" font-weight="bold" fill="#1d3a7a" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">냉장고 보관</text><text x="271.0" y="98.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">기억·메모 의존</text><line x1="346" y1="86" x2="372" y2="86" stroke="#3a4252" stroke-width="1.5" marker-end="url(#ar)"/><rect x="372" y="50" width="150" height="72" rx="10" fill="#eef8f0" stroke="#3a8a52" stroke-width="1.4"/><text x="447.0" y="72.0" font-size="13" font-weight="bold" fill="#1c5530" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">필요할 때 확인</text><text x="447.0" y="98.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">문을 열어 직접 확인</text><line x1="522" y1="86" x2="548" y2="86" stroke="#3a4252" stroke-width="1.5" marker-end="url(#ar)"/><rect x="548" y="50" width="150" height="72" rx="10" fill="#fff6e6" stroke="#c58a1a" stroke-width="1.4"/><text x="623.0" y="72.0" font-size="13" font-weight="bold" fill="#7a5208" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">기한 경과 발견</text><text x="623.0" y="98.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">뒤늦게 인지</text><line x1="698" y1="86" x2="724" y2="86" stroke="#3a4252" stroke-width="1.5" marker-end="url(#ar)"/><rect x="724" y="50" width="150" height="72" rx="10" fill="#fdf0ee" stroke="#c0533e" stroke-width="1.4"/><text x="799.0" y="72.0" font-size="13" font-weight="bold" fill="#7a2a1c" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">폐기·중복 구매</text><text x="799.0" y="98.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">식비 손실</text><rect x="100" y="148" width="700" height="96" rx="8" fill="#fafbfc" stroke="#c7ccd6"/><text x="120.0" y="170.0" font-size="12.5" font-weight="bold" fill="#1f2a44" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">주요 한계</text><text x="130.0" y="198.0" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">· 보유 식재료를 냉장고 밖에서 확인할 수 없음</text><text x="470.0" y="198.0" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">· 소비기한을 기억이나 메모에 의존</text><text x="130.0" y="224.0" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">· 가족 간 보유 정보가 공유되지 않음</text><text x="470.0" y="224.0" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" dominant-baseline="central" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">· 버린 양·이유를 알 수 없어 개선이 어려움</text></svg>