<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FridgeMate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#96ded1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FridgeMate">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--
  FridgeMate 화면 구조 (공통 기반 — 이정남)
  각 담당자는 아래 "자리(area)"만 자기 JS 파일에서 채웁니다. 이 파일은 되도록 고치지 마세요.
  담당 파일 목록과 규칙은 CONTRIBUTING.md 를 보세요.
-->
<div class="app">
  <header class="top">
    <div>
      <h1>FridgeMate</h1>
      <div class="sub">우리 집 냉장고 재료와 소비기한</div>
    </div>
    <span class="offline" id="offline-badge" hidden>오프라인</span>
  </header>

  <!-- 탭 1: 목록 -->
  <section class="view" id="view-list" data-tab="list">
    <div id="alert-area"></div>      <!-- 임박 요약 (js/alert.js · 이지선) -->
    <div id="list-area"></div>       <!-- 식재료 목록 (js/list.js · 이정남) -->
  </section>

  <!-- 탭 2: 등록 -->
  <section class="view" id="view-register" data-tab="register" hidden>
    <div id="register-area"></div>   <!-- 등록 화면 (js/register.js · 이석환) -->
  </section>

  <!-- 탭 3: 레시피 -->
  <section class="view" id="view-recipe" data-tab="recipe" hidden>
    <div id="recipe-area"></div>     <!-- 레시피 추천 (js/recipe.js · 이정남) -->
  </section>

  <!-- 탭 4: 설정 -->
  <section class="view" id="view-settings" data-tab="settings" hidden>
    <div id="settings-area"></div>   <!-- 알림 기준 설정 (js/settings.js · 이지선) -->
    <div id="backup-area"></div>     <!-- 백업·복원 (js/backup.js · 이지선) -->
  </section>
</div>

<!-- 하단 탭 -->
<nav class="tabbar" id="tabbar" aria-label="메뉴">
  <button data-tab="list" aria-current="page"><span aria-hidden="true">🧊</span>목록</button>
  <button data-tab="register"><span aria-hidden="true">➕</span>등록</button>
  <button data-tab="recipe"><span aria-hidden="true">🍳</span>레시피</button>
  <button data-tab="settings"><span aria-hidden="true">⚙️</span>설정</button>
</nav>

<div id="sheet-area"></div>  <!-- 아래에서 올라오는 창(소비·폐기 처리 등)을 띄우는 자리 -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 1) 데이터 -->
<script src="data/foods.js"></script>
<script src="data/recipes.js"></script>
<!-- 2) 공통 기반 (이정남) — 순서 바꾸지 마세요 -->
<script src="js/common/utils.js"></script>
<script src="js/common/storage.js"></script>
<!-- 3) 기능 파일 (담당자별) -->
<script src="js/list.js"></script>
<script src="js/recipe.js"></script>
<script src="js/register.js"></script>
<script src="js/barcode.js"></script>
<script src="js/ocr.js"></script>
<script src="js/alert.js"></script>
<script src="js/process.js"></script>
<script src="js/settings.js"></script>
<script src="js/backup.js"></script>
<!-- 4) 앱 시작 (맨 마지막) -->
<script src="js/common/app.js"></script>
</body>
</html>
